spring.application.name=bellapelle
server.port=8080

# Banco em arquivo (persistente) dentro da pasta do projeto
spring.datasource.url=jdbc:h2:file:./data/bellapelle;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# A criacao/populacao agora e controlada pelo InicializadorBanco (executa so na 1a vez)
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console